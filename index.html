<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tous</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Corner Ribbons placed at top of body for top-most z-index stacking -->
  <div class="corner-ribbon corner-ribbon-tl-1"></div>
  <div class="corner-ribbon corner-ribbon-tl-2"></div>
  <div class="corner-ribbon corner-ribbon-tl-3"></div>

  <div class="corner-ribbon corner-ribbon-tr-1"></div>
  <div class="corner-ribbon corner-ribbon-tr-2"></div>
  <div class="corner-ribbon corner-ribbon-tr-3"></div>

  <header class="navbar">
    <a href="#" id="home-link" class="logo">tous</a>
    <nav id="breadcrumbs" class="breadcrumbs"></nav>
  </header>

  <!-- Main Views Container -->
  <main id="app">
    <!-- Countries View -->
    <div id="view-countries" class="view hidden">
      <h1 class="page-title">Select <span>Country</span></h1>
      <div id="country-grid" class="flag-grid"></div>
    </div>

    <!-- Leagues View -->
    <div id="view-leagues" class="view hidden">
      <h1 class="page-title"><span id="selected-country-title">Leagues</span></h1>
    </div>

    <!-- League Dashboard View -->
    <div id="view-league-dashboard" class="view hidden">
      <h1 class="page-title"><span id="league-name-header">League</span></h1>
      <div id="league-standings-table" class="standings-box"></div>
    </div>

    <!-- Team Dashboard View -->
    <div id="view-team-dashboard" class="view hidden">
      <h1 class="page-title"><span id="team-name-header">Team</span></h1>
      <div id="team-recent-info" class="team-summary-box"></div>
    </div>
  </main>

  <script src="main.js"></script>
</body>
</html>
